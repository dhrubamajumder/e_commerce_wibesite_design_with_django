  {% load static %}
  <style>
    .carousel-item {
    height: 500px;
    position: relative;
  }

  .slider-img {
    width: 100%;
    height: 100%;
    object-fit: cover;   /* image crop হবে, stretch হবে না */
  }

  /* overlay effect (like your image) */
  .carousel-item::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.3);
  }

  /* caption nicer */
  .carousel-caption {
    bottom: 20%;
    z-index: 2;
  }
  </style>

      <section>
        <div class="container-fluid">
          <div class="row">
            <div class="col-md-12">

              <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">

                <!-- Indicators -->
                <div class="carousel-indicators">
                  <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"></button>
                  <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"></button>
                  <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"></button>
                  <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="3"></button>
                </div>

                <!-- Slides -->
                <div class="carousel-inner">

                  <div class="carousel-item active">
                    <img src="{% static 'images/banner-image-2.jpg' %}" class="d-block w-100 slider-img" alt="">
                    <div class="carousel-caption">
                      <h5>Fresh Fruits</h5>
                      <p>Healthy and organic fruits</p>
                    </div>
                  </div>

                  <div class="carousel-item">
                    <img src="{% static 'images/banner-image-1.jpg' %}" class="d-block w-100 slider-img" alt="">
                    <div class="carousel-caption">
                      <h5>Best Deals</h5>
                      <p>Get amazing discounts today</p>
                    </div>
                  </div>

                  <div class="carousel-item">
                    <img src="{% static 'images/banner-image-2.jpg' %}" class="d-block w-100 slider-img" alt="">
                    <div class="carousel-caption">
                      <h5>Quality Products</h5>
                      <p>We provide the best quality</p>
                    </div>
                  </div>

                  <div class="carousel-item">
                    <img src="{% static 'images/fruits.png' %}" class="d-block w-100 slider-img" alt="">
                    <div class="carousel-caption">
                      <h5>Quality Products</h5>
                      <p>We provide the best quality</p>
                    </div>
                  </div>

                </div>

                <!-- Controls -->
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
                  <span class="carousel-control-prev-icon"></span>
                </button>

                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
                  <span class="carousel-control-next-icon"></span>
                </button>

              </div>

            </div>
          </div>
        </div>
      </section>
